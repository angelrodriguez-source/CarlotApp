# Keepalive de Supabase + latido del repositorio
#
# 1) ping: el free tier de Supabase PAUSA el proyecto tras ~7 dias sin
#    actividad. Consulta trivial cada 3 dias para mantenerlo despierto.
#    Usa la anon key (publica, la misma del frontend) — sin secrets.
#    Bonus: si Supabase esta caido o pausado, el job falla y GitHub
#    avisa por email — monitorizacion gratuita.
#
# 2) latido: GitHub DESACTIVA los workflows programados (este, y el
#    recordatorio nocturno) si el repo lleva 60 dias sin commits — avisa
#    por email con "will be disabled soon". Para que no pase nunca, si
#    el ultimo commit tiene 50+ dias este job empuja un commit VACIO:
#    cuenta como actividad y reinicia el contador. El push se hace con
#    GITHUB_TOKEN, que a proposito NO dispara otros workflows (no hay
#    deploy ni migraciones por un latido).
name: Keepalive Supabase

on:
  schedule:
    # Cada 3 dias a las 09:43 UTC (hora "rara" para no coincidir con los
    # picos de crons de GitHub, que se retrasan)
    - cron: '43 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta trivial a Supabase
        run: |
          ANON_KEY='sb_publishable_9GZyG7vIJem21Zc52BE2aw_IdW3wI0W'
          # '|| true' para que un fallo de curl (ej. DNS de proyecto
          # pausado, exit 6) no aborte el script antes del mensaje claro
          STATUS=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            "https://aolbgcuvgcjpogdarpmg.supabase.co/rest/v1/bebes?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" || true)
          echo "HTTP ${STATUS:-sin respuesta}"
          cat /tmp/resp.json 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase no responde (HTTP ${STATUS:-000} — si es 000 el dominio no resuelve, tipico de proyecto PAUSADO). Entra en https://supabase.com/dashboard, pulsa 'Restore project' y relanza este workflow."
            exit 1
          fi
          echo "Supabase despierto ✔"

  # Job aparte: aunque el ping falle (Supabase caido), el latido corre
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit vacio si el repo lleva 50+ dias sin actividad
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          DIAS=$(( ( $(date +%s) - ULTIMO ) / 86400 ))
          echo "Ultimo commit hace $DIAS dias"
          if [ "$DIAS" -lt 50 ]; then
            echo "Actividad reciente: no hace falta latido"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Latido: actividad para que GitHub no desactive los workflows programados"
          git push origin HEAD:main
          echo "Latido empujado ✔ (contador de 60 dias reiniciado)"
