# Recordatorio nocturno por email
#
# Cada noche envía un correo a Angel y Cristina recordando registrar las
# cosas de Carlota, con el resumen de lo que ya hay apuntado hoy (consulta
# la BBDD con el mismo secret SUPABASE_DB_URL de las migraciones).
#
# REQUIERE dos secrets nuevos (Settings > Secrets and variables > Actions):
#   MAIL_USERNAME  el Gmail desde el que se envía (ej. el de Angel)
#   MAIL_PASSWORD  una "contraseña de aplicación" de ese Gmail
#                  (myaccount.google.com/apppasswords — exige tener 2FA)
# Hasta que existan, el workflow falla y GitHub avisa por email (que, mira,
# también funciona de recordatorio).
#
# El cron va en UTC: 20:15 UTC = 22:15 en verano / 21:15 en invierno (Madrid).
name: Recordatorio nocturno

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:

jobs:
  recordatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del día desde Supabase
        id: resumen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Sin secret o con la consulta caída, el recordatorio sale igual con "?"
          set +e
          if [ -z "$DB_URL" ]; then
            FILA=""
          else
            FILA=$(psql "$DB_URL" -t -A -F'|' -c "
            SELECT
              (SELECT count(*) FROM tomas
                 WHERE (inicio AT TIME ZONE 'Europe/Madrid')::date
                     = (now()  AT TIME ZONE 'Europe/Madrid')::date),
              (SELECT count(*) FROM panales
                 WHERE (fecha AT TIME ZONE 'Europe/Madrid')::date
                     = (now()  AT TIME ZONE 'Europe/Madrid')::date),
              -- Sueño de HOY: cada sueño aporta solo su parte de hoy (recortado
              -- a [00:00, 24:00) de Madrid), incluido el nocturno que empezó ayer
              (SELECT coalesce(sum(extract(epoch FROM (
                       least(coalesce(fin, now()) AT TIME ZONE 'Europe/Madrid',
                             date_trunc('day', now() AT TIME ZONE 'Europe/Madrid') + interval '1 day')
                     - greatest(inicio AT TIME ZONE 'Europe/Madrid',
                             date_trunc('day', now() AT TIME ZONE 'Europe/Madrid'))
                     )) / 60)::int, 0)
                 FROM suenos
                 WHERE inicio AT TIME ZONE 'Europe/Madrid'
                       < date_trunc('day', now() AT TIME ZONE 'Europe/Madrid') + interval '1 day'
                   AND coalesce(fin, now()) AT TIME ZONE 'Europe/Madrid'
                       > date_trunc('day', now() AT TIME ZONE 'Europe/Madrid'))
          ")
          fi
          if [ -n "$FILA" ]; then
            TOMAS=$(echo "$FILA" | cut -d'|' -f1)
            PANALES=$(echo "$FILA" | cut -d'|' -f2)
            MIN_SUENO=$(echo "$FILA" | cut -d'|' -f3)
            SUENO="$((MIN_SUENO / 60)) h $((MIN_SUENO % 60)) min"
          else
            TOMAS="?"; PANALES="?"; SUENO="?"
          fi
          echo "tomas=$TOMAS" >> "$GITHUB_OUTPUT"
          echo "panales=$PANALES" >> "$GITHUB_OUTPUT"
          echo "sueno=$SUENO" >> "$GITHUB_OUTPUT"
          echo "Hoy: $TOMAS tomas, $PANALES pañales, $SUENO de sueño"

      - name: Enviar email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: CarlotApp 👶
          to: angel.rodriguez@nfq.es,cristina.villarino.ledo@gmail.com
          subject: '👶 CarlotApp — ¿todo apuntado hoy?'
          body: |
            ¡Buenas noches! Repaso rápido de lo que lleváis registrado hoy:

            🍼 Tomas: ${{ steps.resumen.outputs.tomas }}
            🧷 Pañales: ${{ steps.resumen.outputs.panales }}
            😴 Sueño: ${{ steps.resumen.outputs.sueno }}

            ¿Falta alguna toma, siesta o pañal por apuntar? Se puede añadir
            con el ＋ de abajo (Registrar / Sueño a posteriori) o corregir
            tocando el ✎ de cualquier registro:

            https://angelrodriguez-source.github.io/CarlotApp/

            — El recordatorio nocturno de CarlotApp (recordatorio.yml)
