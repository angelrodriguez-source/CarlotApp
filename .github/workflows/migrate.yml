# Migraciones de Supabase — SOLO lanzamiento manual
#
# El camino normal es automatico: el job `migrar` de deploy.yml aplica las
# migraciones pendientes en cada push a main, ANTES de publicar el
# frontend. Este workflow queda para aplicarlas a mano (pestana Actions >
# "Migraciones Supabase" > Run workflow), p. ej. tras arreglar el secret.
#
# Aplica SOLO las migraciones nuevas: lleva la cuenta en la tabla
# public._migrations de tu base de datos (ver scripts/apply-migrations.sh).
#
# REQUISITO (una sola vez): crear el secret SUPABASE_DB_URL en
# Settings > Secrets and variables > Actions, con la connection string de
# Supabase Dashboard > Settings (engranaje) > Database > Connection string
# (URI, session pooler). Sin el secret, el workflow avisa y no hace nada.
name: Migraciones Supabase

on:
  workflow_dispatch:

# Mismo grupo que el job `migrar` de deploy.yml: nunca dos aplicaciones
# a la vez (el check-then-apply del script no es atomico entre procesos)
concurrency:
  group: migraciones-supabase
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones nuevas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Falta el secret SUPABASE_DB_URL — no se aplican migraciones. Crealo en Settings > Secrets and variables > Actions."
            exit 0
          fi
          bash scripts/apply-migrations.sh
